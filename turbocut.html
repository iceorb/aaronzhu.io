<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Turbo Cut, a daily word game: five prompts, 30 seconds each. Rare answers that people would still recognise score most.">
    <title>Turbo Cut — Aaron Zhu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="turbocut.css">
    <script src="turbocut-data-1.js" defer></script>
    <script src="turbocut-data-2.js" defer></script>
    <script src="turbocut.js" defer></script>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-line">
                <h1><a href="index.html">Aaron Zhu</a></h1>
                <nav class="nav-links" aria-label="Main navigation">
                    <span class="dot mobile-hide">·</span>
                    <a href="index.html">Home</a>
                    <span class="dot">·</span>
                    <a href="works.html">Things</a>
                    <span class="dot">·</span>
                    <a href="reading.html">Reads</a>
                    <span class="dot">·</span>
                    <a href="places.html">Places</a>
                    <span class="dot">·</span>
                    <a href="acknowledgements.html">Nods</a>
                </nav>
            </div>
        </header>

        <main class="tc" id="turbocut">
            <div class="tc-head">
                <div class="tc-ink" aria-hidden="true"><span id="tc-ink-fill" class="tc-ink-fill"></span></div>
                <p class="tc-kicker">
                    <span id="tc-mode">Turbo Cut</span>
                    <span id="tc-progress" class="tc-progress" hidden></span>
                    <span id="tc-seconds" class="tc-seconds" aria-hidden="true">30</span>
                </p>
            </div>

            <noscript>
                <p class="tc-lede">Turbo Cut is a small daily word game, and it needs JavaScript to run. Turn it on and reload to play.</p>
            </noscript>

            <section id="tc-intro" class="tc-section" hidden></section>

            <section id="tc-ready" class="tc-section tc-ready" hidden>
                <p id="tc-ready-label" class="tc-eyebrow">Round 1 of 5</p>
                <h2 class="tc-ready-title">Ready?</h2>
                <p class="tc-muted">30 seconds. Type an answer, press Enter, and keep going. The prompt appears when you start.</p>
                <div class="tc-actions">
                    <button type="button" id="tc-start" class="tc-btn tc-btn-primary">Start</button>
                </div>
            </section>

            <section id="tc-round" class="tc-section tc-round" hidden>
                <label for="tc-input" id="tc-prompt" class="tc-prompt"></label>
                <p id="tc-note" class="tc-note" hidden></p>
                <canvas id="tc-trace" class="tc-trace" aria-hidden="true"></canvas>
                <form id="tc-form" class="tc-form" autocomplete="off">
                    <div class="tc-field" id="tc-field">
                        <input id="tc-input" class="tc-input" type="text" name="answer" autofocus autocomplete="off"
                            autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"
                            aria-describedby="tc-note">
                        <button type="submit" id="tc-submit" class="tc-btn tc-btn-primary" disabled>Enter</button>
                    </div>
                    <p class="tc-feedback-line"><span id="tc-flash" class="tc-flash" aria-live="polite"></span><span id="tc-count" class="tc-count" aria-live="off"></span></p>
                </form>
                <ul id="tc-chips" class="tc-chips" aria-label="Your answers this round"></ul>
                <div class="tc-actions tc-round-actions">
                    <p id="tc-round-end" class="tc-round-end" hidden></p>
                    <button type="button" id="tc-next" class="tc-btn tc-btn-primary" hidden>Next</button>
                </div>
                <div id="tc-play" class="tc-play-wrap" hidden></div>
                <p id="tc-sr" class="visually-hidden" aria-live="polite"></p>
            </section>

            <section id="tc-results" class="tc-section tc-results" hidden></section>
        </main>
    </div>
</body>

</html>
